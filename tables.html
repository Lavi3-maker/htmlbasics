<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/tablestyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Tables in HTML</h1>
    <table>
        <tr>
            <th>Country</th>
            <th>Capital</th>
            <th>Population</th>
        </tr>
        <tr>
            <td>Kenya</td>
            <td>Nairobi</td>
            <td>54 million</td>
        </tr>
        <tr>
           <td>Uganda</td>
           <td>Kampala</td>
           <td>45 million</td> 
        </tr>
        <tr>
            <td>Rwanda</td>
            <td>Kigali</td>
            <td>46 million</td>
        </tr>

    </table>
</body>
</html>
