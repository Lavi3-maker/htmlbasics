<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>Lists in HTML</h1>
    <P>Lists are a group of items that are related together. They can either be ordered or unordered</P>
    <ul>
        <p>My favourite fruits</p>
        <li>Banana</li>
        <li>Apple</li>
        <li>Mango</li>
        <li>Watermelon</li>
    
    </ul><br>
    <ol>
        <p>My favourite books</p>
        <li>Bible</li>
        <li>The Alchemist</li>
        <li>The river and the source</li>
    </ol>
    
</body>
</html>
